<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial;
        }

        /* ID Selector */
        #card {
            width: 250px;
            background-color: white;
            text-align: center;
            padding: 20px;
            margin: 100px auto;
            border-radius: 10px;
        }

        /* Class Selector */
        .photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .name {
            color: darkblue;
        }

        .info {
            color: gray;
        }

        .button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        /* Hover Effect */
        .button:hover {
            background-color: darkblue;
        }

    </style>
</head>

<body>

    <div id="card">

        <img 
        class="photo"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e"
        alt="Student Photo">

        <h2 class="name">Nikesh KC</h2>

        <p class="info">BSc IT Student</p>

        <p class="info">Westcliff University</p>

        <button class="button">View Profile</button>

    </div>

</body>
</html>
